<template>
    <lightning-card title="My Orders" icon-name="standard:orders">
        <div class="slds-p-around_medium">

            <div class="slds-m-bottom_medium">
                <lightning-button
                    label="Create Draft Order"
                    variant="brand"
                    onclick={handleCreateOrder}>
                </lightning-button>
            </div>

            <template if:true={isLoading}>
                <lightning-spinner
                    alternative-text="Loading orders"
                    size="medium">
                </lightning-spinner>
            </template>

            <template if:true={errorMessage}>
                <div class="slds-text-color_error slds-m-bottom_medium">
                    {errorMessage}
                </div>
            </template>

            <template if:true={hasNoOrders}>
                <div class="slds-text-body_regular">
                    No orders found.
                </div>
            </template>

            <template if:true={hasOrders}>
                <lightning-datatable
                    key-field="Id"
                    data={orders}
                    columns={columns}
                    hide-checkbox-column
                    onrowaction={handleRowAction}>
                </lightning-datatable>
            </template>

        </div>
    </lightning-card>
</template>
